# 图片 / 静态文件 — 强缓存 30 天 + gzip
location /public {
    root /data;
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header Vary "Accept-Encoding";

    location ~* \.(jpg|jpeg|png|gif|svg|ico|webp|bmp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location ~* \.(css|js|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

location /api {
    include api_proxy.conf;
}

location /admin {
    root /app/dist/admin;
    try_files $uri $uri/ /index.html =404;
}

location /.well-known {
    alias /data/ssl/.well-known;
}

location / {
    root /app/dist;
    try_files $uri $uri/ /index.html =404;
}
