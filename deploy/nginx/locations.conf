# 兼容旧帖子中的 /public/forum/ 图片路径（实际存储在 /data/public/upload/forum/）
location /public/forum/ {
    alias /data/public/upload/forum/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# 图片 / 静态文件 — 强缓存 30 天 + gzip
location /public {
    root /data;
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header Vary "Accept-Encoding";

    location ~* \.(jpg|jpeg|png|gif|svg|ico|webp|bmp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    location ~* \.(css|js|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

# 带 hash 的构建产物（PC: /static, Mobile: /assets）：一年长缓存
location /static {
    root /app/dist;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

location /assets {
    set $mobile_root /app/dist;
    if ($http_user_agent ~* "(mobile|android|iphone|ipod|ipad|windows phone|blackberry|opera mini)") {
        set $mobile_root /app/dist/mobile;
    }
    root $mobile_root;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

location /api {
    include api_proxy.conf;
}

location /admin {
    root /app/dist/admin;
    try_files $uri $uri/ /index.html =404;
    # SPA HTML 入口不允许启发式缓存，避免发版后用户仍加载旧产物
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache";
}

location /.well-known {
    alias /data/ssl/.well-known;
}

# Mobile device detection
location / {
    set $mobile_root /app/dist;
    if ($http_user_agent ~* "(mobile|android|iphone|ipod|ipad|windows phone|blackberry|opera mini)") {
        set $mobile_root /app/dist/mobile;
    }
    root $mobile_root;
    try_files $uri $uri/ /index.html =404;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache";
}
